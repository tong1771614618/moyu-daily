name: 每日自动生成摸鱼日报

on:
  schedule:
    # 每天北京时间 8:30 自动运行 (UTC 0:30)
    - cron: '30 0 * * *'
  workflow_dispatch:  # 支持手动触发

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 PHP 和扩展
        run: |
          sudo apt-get update
          sudo apt-get install -y php-cli php-gd php-curl php-mbstring

      - name: 安装中文字体
        run: |
          sudo apt-get install -y fonts-wqy-zenhei fonts-noto-cjk

      - name: 生成日报
        env:
          MOYU_WEATHER_API_KEY: ${{ secrets.MOYU_WEATHER_API_KEY }}
        run: php build.php

      - name: 提交并推送更新
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git add -f output/
          git diff --staged --quiet || git commit -m "chore: 更新摸鱼日报 $(date +%Y-%m-%d)"
          git push
